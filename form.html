<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sample form</title>
</head>
<body>
    <h1>Basic HTML form</h1>
    <fieldset>
        <legend>Name</legend>
        <p><b>First Name</b></p>
        <input type="text" name="firstname">
        <p><b>Last Name</b></p>
        <input type="text" name="last name">

    </fieldset>
    <fieldset>
        <legend>Other Question</legend>
        <p><b>Choose a drink:</b></p><input type="radio" name="drink" value="coffee">coffee<br>
        <input type="radio" name="drink" value="tea">tea<br>
        <input type="radio" name="drink" value="hot chocolate">hot chocolate<br>
        <br>
        <p><b>What ice cream do you like?</b></p>
        <input type="checkbox" name="ice cream" value="chocolate">chocolate<br>
        <input type="checkbox" name="ice cream" value="chocolate pudding">chocolate pudding<br>
        <input type="checkbox" name="ice cream" value="chocolate peanut butter">chocolate peanut butter<br>
        <input type="checkbox" name="ice cream" value="stawberry">stawberry<br>
        <input type="checkbox" name="ice cream" value="vanilla">vanilla<br>
        <input type="checkbox" name="ice cream" value="buttersctoch">buttersctoch<br>
        <p><b> Select a school:</b></p>
        <select name="school">
            <option value="nisarga"> Nisarga</option>
            <option value="vidyavahini"> vidyavahini</option>
            <option value="rainbow">Rainbow</option>
            <option value="siddhartha">siddhartha</option>
        </select>
        <p><b>Please provide comments:</b></p>
        <textarea rows="5" cols="50"></textarea>
        
    </fieldset>
</body>
</html>
